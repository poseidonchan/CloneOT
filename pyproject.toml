[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cloneot"
version = "0.1.0"
description = "Predicting clone-specific perturbation responses with lineage-supervised neural inverse optimal transport"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Yanshuo Chen", email = "cys@umd.edu" }]
requires-python = ">=3.10"
keywords = ["single-cell", "lineage tracing", "perturbation", "optimal transport", "inverse optimal transport"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "torch>=2.0",
    "anndata>=0.10",
    "scanpy>=1.10",
    "scikit-misc>=0.3",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "tqdm>=4.60",
]

[project.optional-dependencies]
test = ["pytest>=7"]
docs = ["sphinx>=7", "furo", "myst-nb>=1.0", "sphinx-copybutton", "sphinx-autodoc-typehints", "ipykernel"]
experiments = ["pot>=0.9", "w1ot @ git+https://github.com/poseidonchan/w1ot.git"]

[project.urls]
Homepage = "https://github.com/poseidonchan/CloneOT"
Documentation = "https://poseidonchan.github.io/CloneOT/"
Issues = "https://github.com/poseidonchan/CloneOT/issues"

[tool.setuptools.packages.find]
include = ["cloneot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
